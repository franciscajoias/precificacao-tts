<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precificação TikTok Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0F0F;
    --surface:#1A1A1A;
    --surface-2:#151515;
    --ink:#FFFFFF;
    --muted:#8A8A8E;
    --line:#2B2B2E;
    --accent:#25F4EE;
    --accent-soft:rgba(37,244,238,0.12);
    --fixed:#FE2C55;
    --fixed-soft:rgba(254,44,85,0.10);
    --negative:#FE2C55;
    --negative-soft:rgba(254,44,85,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter', sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  header.app-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:20px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
  .brand-mark svg{width:18px;height:18px;position:relative;z-index:2;}
  h1{font-family:'Poppins',sans-serif;font-size:22px;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .brand-sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .headline-note{color:var(--muted);font-size:13.5px;max-width:260px;text-align:right;line-height:1.45;}

  .kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px;}
  .kpi{background:var(--surface);padding:16px 18px;}
  .kpi-label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .kpi-value{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;letter-spacing:-0.01em;}
  .kpi-value.accent{color:var(--accent);}
  .kpi-value.neg{color:var(--negative);}
  .kpi-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab-btn{font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;background:none;border:none;padding:10px 4px;margin-right:22px;color:var(--muted);cursor:pointer;position:relative;top:1px;}
  .tab-btn.active{color:var(--ink);border-bottom:2px solid var(--accent);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
  @media(max-width:720px){.grid2{grid-template-columns:1fr;}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;border-left:3px solid var(--accent);}
  .card.fixed{border-left-color:var(--fixed);}
  .card-title{font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;margin:0 0 4px;}
  .card-title.accent-text{color:var(--accent);}
  .card-title.fixed-text{color:var(--fixed);}
  .card-desc{font-size:12px;color:var(--muted);margin-bottom:16px;}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12.5px;color:var(--muted);}
  .field .input-row{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden;}
  .field .input-row span.prefix{padding:0 0 0 11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .field input{width:100%;border:none;background:transparent;padding:9px 11px;font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);}
  .field input:focus{outline:2px solid var(--accent);outline-offset:-2px;}

  .fixed-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);}
  .fixed-row:last-child{border-bottom:none;}
  .fixed-row .fl{font-size:13px;color:var(--muted);}
  .fixed-row .fl .rate{color:var(--fixed);font-weight:600;font-size:11.5px;margin-left:6px;}
  .fixed-row .fv{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;}

  .result-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;}
  .result-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:13.5px;}
  .result-row .rl{color:var(--muted);}
  .result-row .rv{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .result-row.total{border-top:1px dashed var(--line);margin-top:4px;padding-top:11px;}
  .result-row.hero{padding-top:14px;margin-top:6px;border-top:1px solid var(--line);}
  .result-row.hero .rl{font-family:'Poppins',sans-serif;font-weight:600;color:var(--ink);font-size:14.5px;}
  .result-row.hero .rv{font-size:19px;}
  .result-row.hero .rv.accent{color:var(--accent);}
  .result-row.hero .rv.neg{color:var(--negative);}
  .pct-tag{font-size:11px;color:var(--muted);margin-left:6px;}

  footer{margin-top:36px;color:var(--muted);font-size:12px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" style="position:absolute;transform:translate(-1.5px,-1.5px);">
          <path d="M3 9L13 3L21 11L11 21L3 13V9Z" fill="#25F4EE"/>
          <circle cx="16.5" cy="7.5" r="1.6" fill="#0F0F0F"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="none" style="position:absolute;transform:translate(1.5px,1.5px);">
          <path d="M3 9L13 3L21 11L11 21L3 13V9Z" fill="#FE2C55"/>
          <circle cx="16.5" cy="7.5" r="1.6" fill="#0F0F0F"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 9L13 3L21 11L11 21L3 13V9Z" fill="#FFFFFF"/>
          <circle cx="16.5" cy="7.5" r="1.6" fill="#0F0F0F"/>
        </svg>
      </div>
      <div>
        <h1>Precificação TikTok Shop</h1>
        <div class="brand-sub">Calculadora de lucro por faixa de preço</div>
      </div>
    </div>
    <div class="headline-note">Preencha o preço, a comissão de afiliado e o custo do produto — os custos da plataforma já vêm calculados.</div>
  </header>

  <div class="kpi-strip">
    <div class="kpi">
      <div class="kpi-label">Total de descontos</div>
      <div class="kpi-value" id="kpiDescontos">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Lucro bruto</div>
      <div class="kpi-value accent" id="kpiBruto">—</div>
      <div class="kpi-sub" id="kpiBrutoPct">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Lucro líquido</div>
      <div class="kpi-value" id="kpiLiquido">—</div>
      <div class="kpi-sub" id="kpiLiquidoPct">—</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="t1">&lt; R$ 50</button>
    <button class="tab-btn" data-tab="t2">&gt; R$ 50</button>
  </div>

  <!-- TAB 1: < R$50 -->
  <div class="tab-panel active" id="tab-t1" data-scenario="1"></div>
  <!-- TAB 2: > R$50 -->
  <div class="tab-panel" id="tab-t2" data-scenario="2"></div>


</div>

<script>
  const fmtMoney = v => isFinite(v) ? v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) : '—';
  const fmtPct = v => isFinite(v) ? (v*100).toLocaleString('pt-BR',{maximumFractionDigits:1,minimumFractionDigits:1})+'%' : '—';

  function buildPanel(scn, defaults){
    const el = document.getElementById('tab-t' + scn);
    el.innerHTML = `
      <div class="grid2">
        <div class="card">
          <div class="card-title accent-text">Dados de entrada</div>
          <div class="card-desc">Preencha com os valores do seu produto</div>
          <div class="field">
            <label>Preço de venda desejado</label>
            <div class="input-row"><span class="prefix">R$</span><input type="number" id="preco-${scn}" value="${defaults.preco}" step="0.01"></div>
          </div>
          <div class="field">
            <label>Comissão do afiliado</label>
            <div class="input-row"><input type="number" id="comissao-${scn}" value="${defaults.comissao}" step="0.1"><span class="prefix" style="padding:0 11px 0 0;">%</span></div>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Custo da mercadoria (produto)</label>
            <div class="input-row"><span class="prefix">R$</span><input type="number" id="custo-${scn}" value="${defaults.custo}" step="0.01"></div>
          </div>
        </div>

        <div class="card fixed">
          <div class="card-title fixed-text">Custos fixos da plataforma</div>
          <div class="card-desc">Calculados automaticamente — não editáveis</div>
          <div class="fixed-row">
            <span class="fl">Comissão TikTok <span class="rate">6%</span></span>
            <span class="fv" id="fx-tiktok-${scn}">—</span>
          </div>
          <div class="fixed-row">
            <span class="fl">Custo de frete <span class="rate">6%</span></span>
            <span class="fv" id="fx-frete-${scn}">—</span>
          </div>
          <div class="fixed-row">
            <span class="fl">Custo por venda <span class="rate">fixo</span></span>
            <span class="fv">R$ 4,00</span>
          </div>
        </div>
      </div>

      <div class="result-card">
        <div class="card-title">Resultado da precificação</div>
        <div class="result-row"><span class="rl">Comissão afiliado (R$)</span><span class="rv" id="rs-comissao-${scn}">—</span></div>
        <div class="result-row total"><span class="rl">Total de descontos</span><span class="rv" id="rs-descontos-${scn}">—</span></div>
        <div class="result-row hero"><span class="rl">Lucro bruto (sem custo do produto)</span><span class="rv accent" id="rs-bruto-${scn}">—</span></div>
        <div class="result-row" style="padding-top:0;"><span class="rl">Margem bruta</span><span class="rv" id="rs-brutoPct-${scn}">—</span></div>
        <div class="result-row hero"><span class="rl">Lucro líquido (após custo do produto)</span><span class="rv" id="rs-liquido-${scn}">—</span></div>
        <div class="result-row" style="padding-top:0;"><span class="rl">Margem líquida</span><span class="rv" id="rs-liquidoPct-${scn}">—</span></div>
      </div>
    `;
    document.querySelectorAll(`#tab-${scn} input`).forEach(i => i.addEventListener('input', render));
  }

  function calc(scn){
    const $ = id => document.getElementById(id);
    const preco = parseFloat($(`preco-${scn}`).value) || 0;
    const comissaoPct = (parseFloat($(`comissao-${scn}`).value) || 0) / 100;
    const custoProduto = parseFloat($(`custo-${scn}`).value) || 0;

    const tiktok = preco * 0.06;
    const frete = preco * 0.06;
    const custoVenda = 4;
    const comissaoAfiliado = preco * comissaoPct;

    const totalDescontos = tiktok + frete + custoVenda + comissaoAfiliado;
    const lucroBruto = preco - totalDescontos;
    const margemBruta = preco !== 0 ? lucroBruto / preco : NaN;
    const lucroLiquido = lucroBruto - custoProduto;
    const margemLiquida = preco !== 0 ? lucroLiquido / preco : NaN;

    $(`fx-tiktok-${scn}`).textContent = fmtMoney(tiktok);
    $(`fx-frete-${scn}`).textContent = fmtMoney(frete);
    $(`rs-comissao-${scn}`).textContent = fmtMoney(comissaoAfiliado);
    $(`rs-descontos-${scn}`).textContent = fmtMoney(totalDescontos);
    $(`rs-bruto-${scn}`).textContent = fmtMoney(lucroBruto);
    $(`rs-brutoPct-${scn}`).textContent = fmtPct(margemBruta);
    const liqEl = $(`rs-liquido-${scn}`);
    liqEl.textContent = fmtMoney(lucroLiquido);
    liqEl.className = 'rv ' + (lucroLiquido < 0 ? 'neg' : 'accent');
    $(`rs-liquidoPct-${scn}`).textContent = fmtPct(margemLiquida);

    return {totalDescontos, lucroBruto, margemBruta, lucroLiquido, margemLiquida};
  }

  function render(){
    calc('1');
    const r = calc('2');
    const activeScn = document.querySelector('.tab-panel.active').dataset.scenario;
    const active = calc(activeScn);

    document.getElementById('kpiDescontos').textContent = fmtMoney(active.totalDescontos);
    document.getElementById('kpiBruto').textContent = fmtMoney(active.lucroBruto);
    document.getElementById('kpiBrutoPct').textContent = fmtPct(active.margemBruta);
    const kl = document.getElementById('kpiLiquido');
    kl.textContent = fmtMoney(active.lucroLiquido);
    kl.className = 'kpi-value ' + (active.lucroLiquido < 0 ? 'neg' : '');
    document.getElementById('kpiLiquidoPct').textContent = fmtPct(active.margemLiquida);
  }

  buildPanel('1', {preco:150, comissao:10, custo:25});
  buildPanel('2', {preco:150, comissao:10, custo:25});

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      render();
    });
  });

  render();
</script>
</body>
</html>
